<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .error {
            padding: 30px;
        }

        h1 {
            font-size: 100px;
            margin: 0;
            font-weight: bold;
        }

        h2 {
            font-size: 28px;
            margin: 10px 0;
        }

        p {
            color: #aaa;
            font-size: 17px;
        }
    </style>
</head>

<body>
    <div class="error">
        <h1>404</h1>
        <h2>Not Found</h2>
        <p>The page you are looking for doesn't exist.</p>
    </div>
</body>
</html>
